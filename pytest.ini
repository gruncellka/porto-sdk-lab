[pytest]
# Lab workspace tests only (scripts + surface tooling). SDK tests run in submodule repos.
pythonpath = .
testpaths = tests surface/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=scripts --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml --cov-fail-under=90
